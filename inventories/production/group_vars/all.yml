---
env_name: production
timezone: Asia/Phnom_Penh
ansible_python_interpreter: /usr/bin/python3

project_name: "esxi-ansible-iac"

guest_credential_source: ubuntu_24.04-mgmt-01
control_node_prerequisites_vmware_venv_dir: "{{ inventory_dir }}/../../.venv/vmware"

kubespray_cluster_name: production
kubespray_inventory_output_dir: "{{ playbook_dir }}/../.generated/kubespray/{{ kubespray_cluster_name }}"

# Single-ESXi-host assumption: VM lifecycle playbooks target vm_esxi_8.0.
# If managed VMs are split across multiple ESXi hosts, make this host-scoped.
managed_vm_names: "{{ groups['managed_vms'] | default([]) }}"

kubespray_inventory_control_plane_vm_names: "{{ groups['kube_control_plane'] | default([]) }}"

kubespray_inventory_etcd_vm_names: "{{ groups['kube_control_plane'] | default([]) }}"

kubespray_inventory_worker_vm_names: "{{ groups['kube_node'] | default([]) }}"

kubespray_inventory_network_plugin: calico
kubespray_inventory_container_manager: containerd
kubespray_inventory_kube_proxy_mode: ipvs
kubespray_inventory_kube_proxy_metrics_bind_address: "0.0.0.0:10249"
kubespray_inventory_enable_kube_vip: true
kubespray_inventory_kube_vip_version: "1.0.4"
kubespray_inventory_kube_vip_address: 172.16.6.150
kubespray_inventory_dns_mode: coredns
kubespray_inventory_enable_nodelocaldns: true
kubespray_inventory_nodelocaldns_ip: 169.254.25.10
kubespray_inventory_nodelocaldns_health_port: 9254
kubespray_inventory_enable_kubelet_server_certificate_rotation: true
kubespray_inventory_kubelet_csr_approver_values:
  providerRegex: '^ubuntu-24-04-(mgmt|wrk)-0[1-3]$'
  providerIpPrefixes: '172.16.6.20/32,172.16.6.21/32,172.16.6.22/32,172.16.6.23/32,172.16.6.24/32,172.16.6.25/32'
  bypassDnsResolution: false
  bypassHostnameCheck: false
kubespray_inventory_service_cidr: 10.233.0.0/18
kubespray_inventory_pod_cidr: 10.233.64.0/18
kubespray_inventory_calico_datastore: kdd
kubespray_inventory_calico_network_backend: vxlan
kubespray_inventory_calico_ipip_mode: Never
kubespray_inventory_calico_vxlan_mode: Always
guest_base_enable_nic_offloads_disabled: true
guest_base_nic_offload_interface: "{{ kubernetes_primary_interface }}"
guest_base_nic_offload_features:
  - "gro off"
  - "lro off"
  - "tx-udp_tnl-segmentation off"
  - "tx-udp_tnl-csum-segmentation off"

kubespray_inventory_enable_helm: true
kubespray_inventory_enable_metrics_server: true
kubespray_inventory_enable_metrics_server_kubelet_insecure_tls: false
kubespray_inventory_enable_metrics_server_apiservice_insecure_skip_tls_verify: true
kubespray_inventory_metrics_server_limits_cpu: "300m"
kubespray_inventory_metrics_server_limits_memory: "300Mi"
kubespray_inventory_metrics_server_requests_cpu: "100m"
kubespray_inventory_metrics_server_requests_memory: "200Mi"
kubespray_metrics_server_probe_timeout_seconds: 5
kubespray_inventory_enable_cert_manager: true
kubespray_inventory_enable_argocd: true
kubespray_inventory_enable_registry: true
kubespray_inventory_enable_local_path_provisioner: false

kubespray_inventory_enable_metallb: true
kubespray_inventory_metallb_ip_range:
  - 172.16.6.200-172.16.6.250

kubespray_version: "v2.31.0"
