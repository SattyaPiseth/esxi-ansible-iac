---
name: Validate infrastructure code

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-24.04
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install validation dependencies
        run: |
          python -m pip install --requirement requirements-dev.txt
          ansible-galaxy collection install --requirement requirements.yml

      - name: Provide non-secret CI vault placeholder
        run: printf 'ci-placeholder\n' > .vaultpass

      - name: Validate inventory
        run: ansible-inventory --graph

      - name: Lint YAML and Ansible content
