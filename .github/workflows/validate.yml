---
name: Validate infrastructure code

on:
  workflow_dispatch:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: validate-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-24.04
    timeout-minutes: 20

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-dev.txt

      - name: Set up Packer
        uses: hashicorp/setup-packer@v3
        with:
          version: "1.16.1"

      - name: Install validation dependencies
        run: |
          python -m pip install --requirement requirements-dev.txt
          ansible-galaxy collection install --requirement requirements.yml

      - name: Install just for wrapper regression tests
        run: |
          sudo apt-get update
          sudo apt-get install -y just

      - name: Run offline regression tests
        run: python -m unittest discover -s tests -v

      - name: Provide non-secret CI vault placeholder
        run: printf 'ci-placeholder\n' > .vaultpass

      - name: Validate inventory
        run: ansible-inventory --graph

      - name: Validate Packer templates
        run: scripts/validate-packer.sh

      - name: Run repository validation
        run: pre-commit run --all-files
