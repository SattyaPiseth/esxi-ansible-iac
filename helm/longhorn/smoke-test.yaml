---
apiVersion: v1
kind: Namespace
metadata:
  name: longhorn-smoke
---
apiVersion: storage.k8s.io/v1
kind: StorageClass
metadata:
  name: longhorn-smoke
provisioner: driver.longhorn.io
allowVolumeExpansion: true
reclaimPolicy: Delete
volumeBindingMode: Immediate
parameters:
  dataEngine: v1
  dataLocality: best-effort
  fsType: ext4
  numberOfReplicas: "3"
  staleReplicaTimeout: "30"
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: longhorn-rwo
  namespace: longhorn-smoke
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 1Gi
  storageClassName: longhorn-smoke
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: longhorn-rwx
  namespace: longhorn-smoke
spec:
  accessModes:
    - ReadWriteMany
  resources:
    requests:
      storage: 1Gi
  storageClassName: longhorn-smoke
---
apiVersion: v1
kind: Pod
metadata:
  name: longhorn-rwo
  namespace: longhorn-smoke
spec:
  containers:
    - name: writer
      image: busybox:1.36
      command:
        - sh
        - -ec
        - echo rwo-ok > /data/result && sleep 3600
      volumeMounts:
        - name: data
          mountPath: /data
  volumes:
    - name: data
      persistentVolumeClaim:
        claimName: longhorn-rwo
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: longhorn-rwx
  namespace: longhorn-smoke
spec:
  replicas: 2
  selector:
    matchLabels:
      app: longhorn-rwx
  template:
    metadata:
      labels:
        app: longhorn-rwx
    spec:
      affinity:
        podAntiAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            - labelSelector:
                matchLabels:
                  app: longhorn-rwx
              topologyKey: kubernetes.io/hostname
      containers:
        - name: writer
          image: busybox:1.36
          command:
            - sh
            - -ec
            - echo "$HOSTNAME" > "/data/$HOSTNAME" && sleep 3600
          volumeMounts:
            - name: data
              mountPath: /data
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: longhorn-rwx
