---
- name: Validate control node operating system
  ansible.builtin.assert:
    that:
      - ansible_facts.system == "Linux"
      - ansible_facts.os_family == "Debian"
    fail_msg: "This project expects a Debian/Ubuntu Ansible control node."

- name: Install control node Python dependencies
  ansible.builtin.apt:
    name: "{{ control_node_prerequisites_python_apt_packages }}"
    state: present
    update_cache: true
    cache_valid_time: 3600
  become: true

- name: Install VMware Python SDK dependencies
  ansible.builtin.pip:
    name: "{{ control_node_prerequisites_vmware_python_packages }}"
    virtualenv: "{{ control_node_prerequisites_vmware_venv_dir }}"
    virtualenv_command: "python3 -m venv"

- name: Validate VMware Python SDK is available to Ansible
  ansible.builtin.command:
    argv:
      - "{{ control_node_prerequisites_vmware_venv_dir }}/bin/python"
      - "-c"
      - "import pyVim, pyVmomi"
  changed_when: false
