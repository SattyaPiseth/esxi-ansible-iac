---
- name: Gather ESXi host facts
  community.vmware.vmware_host_facts:
    hostname: "{{ esxi_hostname }}"
    username: "{{ esxi_username }}"
    password: "{{ esxi_password }}"
    validate_certs: "{{ esxi_validate_certs }}"
  no_log: false
  register: esxi_facts_result

- name: Show ESXi summary
  ansible.builtin.debug:
    msg:
      - "ESXi Host: {{ esxi_hostname }}"
      - "Product: {{ esxi_facts_result.ansible_facts.ansible_product_name | default('unknown') }}"
      - "Version: {{ esxi_facts_result.ansible_facts.ansible_distribution_version | default('unknown') }}"
      - "Memory MB: {{ esxi_facts_result.ansible_facts.ansible_memtotal_mb | default('unknown') }}"
