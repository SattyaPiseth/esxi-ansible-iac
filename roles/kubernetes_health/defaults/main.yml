---
kubernetes_health_artifacts_dir: >-
  {{ playbook_dir }}/../.generated/kubespray/{{ kubespray_cluster_name | default('production') }}/artifacts
kubernetes_health_kubectl: "{{ kubernetes_health_artifacts_dir }}/kubectl"
kubernetes_health_kubeconfig: "{{ kubernetes_health_artifacts_dir }}/admin.conf"
kubernetes_health_operator_kubeconfig: "{{ lookup('env', 'HOME') }}/.kube/config"
kubernetes_health_rollout_timeout: 180s
kubernetes_health_cert_manager_enabled: "{{ kubespray_inventory_enable_cert_manager | default(false) }}"
kubernetes_health_metrics_server_enabled: "{{ kubespray_inventory_enable_metrics_server | default(false) }}"
kubernetes_health_metrics_server_apiservice_insecure_skip_tls_verify: >-
  {{ kubespray_inventory_enable_metrics_server_apiservice_insecure_skip_tls_verify | default(true) }}
kubernetes_health_metrics_server_limits_cpu: "{{ kubespray_inventory_metrics_server_limits_cpu | default('') }}"
kubernetes_health_metrics_server_limits_memory: "{{ kubespray_inventory_metrics_server_limits_memory | default('') }}"
kubernetes_health_metrics_server_requests_cpu: "{{ kubespray_inventory_metrics_server_requests_cpu | default('') }}"
kubernetes_health_metrics_server_requests_memory: "{{ kubespray_inventory_metrics_server_requests_memory | default('') }}"
kubernetes_health_metrics_server_probe_timeout_seconds: >-
  {{ kubespray_metrics_server_probe_timeout_seconds | default(5) }}
kubernetes_health_enable_warning_event_output: true
kubernetes_health_enable_warning_event_failure: false
kubernetes_health_warning_event_active_window_minutes: 15
kubernetes_health_warning_event_exclude_regex: ""
kubernetes_health_validate_metallb_controller_reachability: "{{ kubespray_inventory_enable_metallb | default(false) }}"
kubernetes_health_validate_metallb_address_pools: "{{ kubernetes_health_validate_metallb_controller_reachability }}"
kubernetes_health_validate_kube_vip: "{{ kubespray_inventory_enable_kube_vip | default(false) }}"
kubernetes_health_kube_vip_max_restarts: 0
kubernetes_health_validate_internal_ca_clusterissuer: "{{ kubespray_inventory_enable_cert_manager | default(false) }}"
kubernetes_health_internal_ca_clusterissuer_name: k8s-internal-ca
kubernetes_health_internal_ca_secret_name: k8s-internal-root-ca-secret
kubernetes_health_internal_ca_secret_namespace: cert-manager
kubernetes_health_validate_nic_offloads: "{{ guest_base_enable_nic_offloads_disabled | default(false) }}"
kubernetes_health_enable_lb_smoke_test: false
kubernetes_health_lb_smoke_test_name: kubernetes-health-lb-smoke
kubernetes_health_lb_smoke_test_image: nginx:1.27
kubernetes_health_lb_smoke_test_timeout: 120
