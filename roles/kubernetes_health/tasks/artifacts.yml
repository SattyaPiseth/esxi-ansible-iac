---
- name: Check Kubernetes client artifacts
  ansible.builtin.stat:
    path: "{{ item }}"
    follow: true
  loop:
    - "{{ kubernetes_health_kubectl }}"
    - "{{ kubernetes_health_kubeconfig }}"
  register: kubernetes_health_artifacts

- name: Validate Kubernetes client artifacts are usable
  ansible.builtin.assert:
    that:
      - item.stat.exists
      - item.stat.isreg
      - item.item != kubernetes_health_kubectl or item.stat.executable
      - item.item != kubernetes_health_kubeconfig or item.stat.readable
    fail_msg: >-
      Kubernetes client file is missing or unusable: {{ item.item }}.
      Generated .generated/ artifacts are local to the deployment checkout and
      are not restored by git pull. Supply absolute paths through
      kubernetes_health_kubectl and kubernetes_health_kubeconfig for an existing
      client and kubeconfig for this cluster, or securely restore the artifacts
      from the original control node. Cluster redeployment is not required just
      to restore client files.
  loop: "{{ kubernetes_health_artifacts.results }}"
  loop_control:
    label: "{{ item.item }}"

- name: Ensure operator kubeconfig directory exists
  ansible.builtin.file:
    path: "{{ kubernetes_health_operator_kubeconfig | dirname }}"
    state: directory
    mode: "0700"

- name: Install operator kubeconfig
  ansible.builtin.copy:
    src: "{{ kubernetes_health_kubeconfig }}"
    dest: "{{ kubernetes_health_operator_kubeconfig }}"
    remote_src: true
    mode: "0600"
