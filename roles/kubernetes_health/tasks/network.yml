---
- name: Read Kubernetes node NIC offload state
  ansible.builtin.command:
    argv:
      - ethtool
      - -k
      - "{{ hostvars[item].kubernetes_primary_interface }}"
  changed_when: false
  become: true
  delegate_to: "{{ item }}"
  loop: "{{ (kubespray_inventory_control_plane_vm_names + kubespray_inventory_worker_vm_names) | unique | list }}"
  register: kubernetes_health_nic_offloads
  when: kubernetes_health_validate_nic_offloads | bool

- name: Build expected Kubernetes node NIC offload state
  ansible.builtin.set_fact:
    kubernetes_health_nic_offload_expected_statuses: >-
      {{
        kubernetes_health_nic_offload_expected_statuses | default([])
        + [
            kubernetes_health_nic_offload_feature_names.get(
              kubernetes_health_nic_offload_feature_parts[0],
              kubernetes_health_nic_offload_feature_parts[0]
            )
            ~ ': '
            ~ kubernetes_health_nic_offload_feature_parts[1]
          ]
      }}
  vars:
    kubernetes_health_nic_offload_feature_parts: "{{ item.split() }}"
  loop: "{{ guest_base_nic_offload_features }}"
  when: kubernetes_health_validate_nic_offloads | bool

- name: Validate Kubernetes node NIC offload state
  ansible.builtin.assert:
    that:
      - item.1 in item.0.stdout
    fail_msg: >-
      {{ item.0.item }} does not report expected NIC offload state {{ item.1 }};
      this can break Calico VXLAN traffic on this VMware environment.
  loop: >-
    {{
      (kubernetes_health_nic_offloads.results | default([]))
      | product(kubernetes_health_nic_offload_expected_statuses | default([]))
      | list
    }}
  loop_control:
    label: "{{ item.0.item }}: {{ item.1 }}"
  when: kubernetes_health_validate_nic_offloads | bool
