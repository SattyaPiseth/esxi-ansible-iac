---
- name: Validate SSH key rotation request
  hosts: localhost
  gather_facts: false
  vars:
    rotation_current_private_key_file: "{{ lookup('env', 'HOME') }}/.ssh/esxi_ansible_ed25519"
    rotation_current_public_key_file: "{{ rotation_current_private_key_file }}.pub"
    rotation_new_private_key_file: "{{ rotation_current_private_key_file }}_next"
    rotation_new_public_key_file: "{{ rotation_new_private_key_file }}.pub"
    rotation_key_paths:
      - "{{ rotation_current_private_key_file }}"
      - "{{ rotation_current_public_key_file }}"
      - "{{ rotation_new_private_key_file }}"
      - "{{ rotation_new_public_key_file }}"
  tasks:
    - name: Require explicit rotation phase
      ansible.builtin.assert:
        that:
          - rotation_phase is defined
          - rotation_phase in ['deploy', 'revoke']
        fail_msg: "Set rotation_phase explicitly to deploy or revoke."

    - name: Validate rotation key files
      ansible.builtin.stat:
        path: "{{ item }}"
        get_checksum: false
        get_mime: false
        get_attributes: false
      loop: "{{ rotation_key_paths }}"
      loop_control:
        label: "{{ item }}"
      register: rotation_key_file
      failed_when: >-
        not rotation_key_file.stat.exists
        or not (rotation_key_file.stat.isreg | default(false))

    - name: Read rotation key fingerprints
      ansible.builtin.command:
        argv:
          - ssh-keygen
          - -l
          - -E
          - sha256
          - -f
          - "{{ item }}"
      loop: "{{ rotation_key_paths }}"
      changed_when: false
      register: rotation_key_fingerprints

    - name: Validate rotation key pairs
      ansible.builtin.assert:
        that:
          - rotation_key_fingerprints.results[0].stdout.split()[1] == rotation_key_fingerprints.results[1].stdout.split()[1]
          - rotation_key_fingerprints.results[2].stdout.split()[1] == rotation_key_fingerprints.results[3].stdout.split()[1]
          - rotation_key_fingerprints.results[1].stdout.split()[1] != rotation_key_fingerprints.results[3].stdout.split()[1]
        fail_msg: >-
          Current and replacement keypairs must each match, and the replacement
          key must differ from the current key.

- name: Rotate managed guest SSH key
  hosts: linux_vms
  gather_facts: false
  vars:
    rotation_current_private_key_file: "{{ lookup('env', 'HOME') }}/.ssh/esxi_ansible_ed25519"
    rotation_current_public_key_file: "{{ rotation_current_private_key_file }}.pub"
    rotation_new_private_key_file: "{{ rotation_current_private_key_file }}_next"
    rotation_new_public_key_file: "{{ rotation_new_private_key_file }}.pub"
    ansible_ssh_private_key_file: >-
      {{ rotation_current_private_key_file
         if rotation_phase == 'deploy'
         else rotation_new_private_key_file }}
    ansible_ssh_common_args: >-
      -o IdentitiesOnly=yes -o PreferredAuthentications=publickey
      -o PasswordAuthentication=no
      -o KbdInteractiveAuthentication=no
  tasks:
    - name: Validate rotation privilege escalation
      ansible.builtin.assert:
        that:
          - guest_become_ready | bool
        fail_msg: >-
          SSH key rotation requires a non-empty ansible_become_password from
          the linux_vms vault, --ask-become-pass, or
          guest_passwordless_sudo=true.

    - name: Add replacement SSH public key
      ansible.posix.authorized_key:
        user: "{{ ansible_user }}"
        key: "{{ lookup('ansible.builtin.file', rotation_new_public_key_file) }}"
        state: present
        manage_dir: true
        exclusive: false
      become: true
      when: rotation_phase == 'deploy'

    - name: Remove current SSH public key
      ansible.posix.authorized_key:
        user: "{{ ansible_user }}"
        key: "{{ lookup('ansible.builtin.file', rotation_current_public_key_file) }}"
        state: absent
      become: true
      when: rotation_phase == 'revoke'

    - name: Select replacement key for connection validation
      ansible.builtin.set_fact:
        ansible_ssh_private_key_file: "{{ rotation_new_private_key_file }}"
      when: rotation_phase == 'deploy'

    - name: Reset persistent SSH connection
      ansible.builtin.meta: reset_connection

    - name: Verify rotated SSH key connectivity
      ansible.builtin.ping:
