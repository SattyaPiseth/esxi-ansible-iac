---
- name: Delete selected VMs from their owning ESXi hosts
  hosts: managed_vm_esxi
  gather_facts: false
  vars:
    vm_delete_scope: "{{ scope | default('single') }}"
    vm_delete_targets: >-
      {{
        esxi_managed_vm_names
        if vm_delete_scope == 'all'
        else (
          [vm_delete_name]
          if (vm_delete_name | default('')) in esxi_managed_vm_names
          else []
        )
      }}
    vm_delete_enable_all_confirmation: false
    vm_delete_all_confirmation_phrase: ""
    vm_delete_required_all_confirmation_phrase: DELETE_ALL_MANAGED_VMS

  roles:
    - esxi_validate

  tasks:
    - name: Validate VM deletion request
      ansible.builtin.assert:
        that:
          - vm_delete_scope in ['single', 'all']
          - vm_delete_scope == 'all' or (vm_delete_name | default('')) | string | trim | length > 0
          - vm_delete_scope == 'all' or (vm_delete_name | default('')) in managed_vm_names
          - >-
            vm_delete_scope != 'all'
            or (
              vm_delete_enable_all_confirmation | bool
              and vm_delete_all_confirmation_phrase == vm_delete_required_all_confirmation_phrase
            )
        fail_msg: >-
          Pass a managed vm_delete_name for one VM. Batch deletion also requires
          -e scope=all -e vm_delete_enable_all_confirmation=true
          -e vm_delete_all_confirmation_phrase={{ vm_delete_required_all_confirmation_phrase }}.
      run_once: true

    - name: Validate selected hosts include the VM owner
      ansible.builtin.assert:
        that:
          - vm_delete_name in selected_managed_vm_names
        fail_msg: >-
          VM '{{ vm_delete_name }}' belongs to
          {{ managed_vm_esxi_ownership | dict2items
              | selectattr('value', 'contains', vm_delete_name)
              | map(attribute='key') | join(', ') }}.
          Include its owning ESXi host in --limit, or remove --limit.
      vars:
        selected_managed_vm_names: >-
          {{ ansible_play_hosts_all
              | map('extract', managed_vm_esxi_ownership) | flatten | list }}
      when: vm_delete_scope == 'single'
      run_once: true

    - name: Validate host-owned VM deletion targets
      ansible.builtin.assert:
        that:
          - vm_delete_targets is sequence
          - vm_delete_targets is not string
          - vm_delete_targets | reject('string') | list | length == 0
          - vm_delete_targets | unique | list | length == vm_delete_targets | length
          - vm_delete_targets | difference(esxi_managed_vm_names) | length == 0
        fail_msg: "Deletion targets must belong to {{ inventory_hostname }}."

    - name: Delete selected host-owned VM
      ansible.builtin.include_role:
        name: vm_delete
      vars:
        vm_delete_name: "{{ delete_vm_name }}"
      loop: "{{ vm_delete_targets }}"
      loop_control:
        loop_var: delete_vm_name
      when: vm_delete_scope == 'single'

    - name: Delete all host-owned VMs with batch confirmation
      ansible.builtin.include_role:
        name: vm_delete
      vars:
        vm_delete_name: "{{ delete_vm_name }}"
        vm_delete_confirm: true
        vm_delete_confirm_name: "{{ delete_vm_name }}"
      loop: "{{ vm_delete_targets }}"
      loop_control:
        loop_var: delete_vm_name
      when: vm_delete_scope == 'all'
