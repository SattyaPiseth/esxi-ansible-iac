---
- name: Validate ESXi production variables
  hosts: vmware_esxi
  gather_facts: false
  roles:
    - esxi_validate

- name: Gather ESXi host facts
  hosts: vmware_esxi
  gather_facts: false
  roles:
    - esxi_facts

- name: Power on all managed VMs
  ansible.builtin.import_playbook: 04-vm-power.yml
  vars:
    scope: all
    vm_power_state: powered-on
