---
- name: Validate managed VM inventory on ESXi
  hosts: managed_vm_esxi
  gather_facts: false

  roles:
    - esxi_validate

  tasks:
    - name: Validate managed VM list
      ansible.builtin.assert:
        that:
          - esxi_managed_vm_names is defined
          - esxi_managed_vm_names is sequence
          - esxi_managed_vm_names is not string
          - esxi_managed_vm_names | length > 0
          - esxi_managed_vm_names | reject('string') | list | length == 0
          - esxi_managed_vm_names | map('trim') | reject('equalto', '') | list | length == esxi_managed_vm_names | length
          - esxi_managed_vm_names | unique | list | length == esxi_managed_vm_names | length
        fail_msg: "esxi_managed_vm_names must be a non-empty unique list of VM names."

    - name: Read ESXi VM inventory
      community.vmware.vmware_vm_info:
        hostname: "{{ esxi_hostname }}"
        username: "{{ esxi_username }}"
        password: "{{ esxi_password }}"
        validate_certs: "{{ esxi_validate_certs }}"
      no_log: true
      register: managed_vm_info

    - name: Validate each managed VM resolves exactly once
      ansible.builtin.assert:
        that:
          - >-
            managed_vm_info.virtual_machines
            | selectattr('guest_name', 'equalto', managed_vm_name)
            | list
            | length == 1
        fail_msg: "Host-owned managed VM '{{ managed_vm_name }}' must exist exactly once on ESXi."
      loop: "{{ esxi_managed_vm_names }}"
      loop_control:
        loop_var: managed_vm_name

    - name: Show validated managed VM names
      ansible.builtin.debug:
        msg: "Validated host-owned managed VMs: {{ esxi_managed_vm_names }}"
